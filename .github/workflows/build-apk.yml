name: Build NoteScan APK Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Configure Gradle groovy-xml init script
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/groovy-xml.gradle"
          initscript {
              repositories {
                  mavenCentral()
              }
              dependencies {
                  classpath "org.codehaus.groovy:groovy-xml:3.0.21"
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                  }
                  dependencies {
                      classpath "org.codehaus.groovy:groovy-xml:3.0.21"
                  }
              }
          }
          EOF

      - name: Build APK Release
        run: flutter build apk --release --no-obfuscate

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteScan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
