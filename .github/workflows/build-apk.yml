name: Build NoteScan APK Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions GitHub

jobs:
  build-apk:
    name: Build Flutter APK Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java (diperlukan oleh Gradle untuk Android build)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Flutter SDK versi stabil terbaru
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 4. Buat file .env dari GitHub Secrets agar tidak di-commit ke repository
      - name: Create .env file from Secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_MODEL=gemini-1.5-flash" >> .env

      # 5. Unduh seluruh dependensi Flutter
      - name: Flutter Pub Get
        run: flutter pub get

      # 6. Validasi kode (opsional tapi direkomendasikan)
      - name: Flutter Analyze (Lint)
        run: flutter analyze --no-fatal-infos || true

      # 7. Jalankan unit & widget tests
      - name: Flutter Test
        run: flutter test || true

      # 8. Build APK mode Release (unsigned – tanpa signing keystore)
      - name: Build APK Release
        run: flutter build apk --release --no-obfuscate

      # 9. Upload APK sebagai Artifact yang bisa diunduh dari Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteScan-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 10. (Opsional) Tampilkan ukuran APK
      - name: APK File Info
        run: |
          echo "===== Informasi APK Release NoteScan ====="
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "==========================================="
