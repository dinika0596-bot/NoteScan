name: notescan
description: "A mobile application for students to scan, summarize, and ask documents using Flutter, Supabase, and Gemini API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.8.0
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  file_picker: ^9.0.0
  uuid: ^4.5.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4+1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
